version: '3.8'
services:
  backend:
    build: ./backend
    ports: ["5001:5001"]
    volumes: ["./backend/data:/app/data", "./backend/profiles:/app/profiles"]
  frontend:
    build: ./frontend
    ports: ["3000:80"]
    depends_on: [backend]
  redis:
    image: redis:alpine
    ports: ["6379:6379"]
